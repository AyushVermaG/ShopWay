<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ShopWay</title>
    <link rel="stylesheet" href="ShopWay.css">
    <link rel="stylesheet" href="cart.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dark">
    <!-- Dark/Light Mode Toggle -->
    <div class="mode-toggle">
        <button onclick="toggleMode()">🌙 / 🌞</button>
    </div>

    <!-- Header and Navbar -->
    <header class="navbar">
        <div class="logo">ShopWay</div>
        <nav>
            <ul class="nav-links">
                <li><a href="shopway.html">Home</a></li>
                <li><a href="shopway.html#product">Products</a></li>
                <li><a href="shopway.html#delivery">Delivery</a></li>
                <li><a href="Chat.html">Chat</a></li>
                <li><a href="cart.html" class="active">Cart <span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Cart Content -->
    <main class="cart-container">
        <h1>Your Shopping Cart</h1>
        
        <div class="cart-items">
            <!-- Cart items will be dynamically inserted here -->
            <div id="empty-cart-message">
                <i class="fas fa-shopping-cart"></i>
                <p>Your cart is empty</p>
                <a href="shopway.html#product" class="btn">Continue Shopping</a>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-card">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span>FREE</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>
                <button id="checkout-btn" class="btn" disabled>Proceed to Checkout</button>
                <a href="shopway.html#product" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>
      
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
        </div>
      
        <div class="footer-bottom">
            &copy; 2025 ShopWay. All rights reserved.
        </div>
    </footer>

    <script src="ShopWay.js"></script>
    <script src="cart.js"></script>
</body>
</html>
